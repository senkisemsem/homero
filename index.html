<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b7a75">
<link rel="icon" href="icon-192.png">
<title>Mi hőmérők – BLE</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f8; --card:#fff; --fg:#14181c; --mut:#6b7680; --acc:#0b7a75; --hum:#3b6fd4; --bad:#b3261e; --line:#e1e5e9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101315; --card:#1a1e21; --fg:#eef1f3; --mut:#93a0a9; --acc:#4fd1c5; --hum:#8ab4ff; --bad:#f2b8b5; --line:#2a3035; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:4px 0 12px; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; background:var(--acc); color:#fff; font-weight:600; }
  @media (prefers-color-scheme: dark) { button { color:#06201e; } }
  button.sec { background:transparent; color:var(--mut); border:1px solid var(--line); padding:6px 10px; font-weight:500; font-size:14px; }
  button.sec.on { color:var(--fg); border-color:var(--acc); background:color-mix(in srgb, var(--acc) 15%, transparent); }
  #add { width:100%; }
  #msg { color:var(--bad); margin:10px 0; min-height:1.2em; font-size:14px; }
  #ranges { display:flex; gap:8px; align-items:center; margin:4px 0 0; }
  #ranges span { font-size:13px; color:var(--mut); margin-right:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:600; }
  .st { font-size:13px; color:var(--mut); }
  .st.ok { color:var(--acc); }
  .vals { display:flex; gap:24px; align-items:baseline; margin:10px 0 6px; }
  .t { font-size:44px; font-weight:700; letter-spacing:-1px; }
  .h { font-size:28px; font-weight:600; color:var(--mut); }
  .meta { font-size:13px; color:var(--mut); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .legend { font-size:12px; color:var(--mut); margin:12px 0 2px; display:flex; gap:14px; }
  .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  canvas { width:100%; height:160px; display:block; }
  .note { font-size:13px; color:var(--mut); margin-top:16px; }
</style>
</head>
<body>
<h1>Mi hőmérők (LYWSD03MMC)</h1>
<button id="add">+ Hőmérő hozzáadása</button>
<div id="msg"></div>
<div id="ranges"><span>Grafikon:</span></div>
<div id="list"></div>
<p class="note">Max. 3 hőmérő. Az oldal percenként rögzít egy mérést 14 napig. A „Előzmények letöltése" gomb a hőmérő belső, órás bontású memóriáját olvassa ki (min/max átlaga), így a nyitva töltött időn kívüli időszak is megjelenik.</p>

<script>
const SERVICE = 'ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6';
const CHAR = 'ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6';
const MAX = 3;
const SAMPLE_EVERY = 60;           // mp
const KEEP = 14 * 86400;           // mp
const RANGES = [['1 ó', 3600], ['6 ó', 6 * 3600], ['24 ó', 86400], ['7 nap', 7 * 86400], ['30 nap', 30 * 86400]];
const U = h => 'ebe0' + h + '-7a0a-4b0c-8a1a-6ff2997da3a6';
const hex = dv => [...new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength)].map(b => b.toString(16).padStart(2, '0')).join(' ');
const devices = new Map();
let range = 6 * 3600;
try { range = +localStorage.getItem('range') || range; } catch (_) {}
const $ = id => document.getElementById(id);
const msg = t => $('msg').textContent = t || '';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- időtartam gombok
RANGES.forEach(([label, sec]) => {
  const b = document.createElement('button');
  b.className = 'sec'; b.textContent = label; b.dataset.sec = sec;
  b.onclick = () => { range = sec; try { localStorage.setItem('range', sec); } catch (_) {} markRange(); drawAll(); };
  $('ranges').appendChild(b);
});
function markRange() { document.querySelectorAll('#ranges button').forEach(b => b.classList.toggle('on', +b.dataset.sec === range)); }
markRange();

if (!navigator.bluetooth) {
  msg('Ez a böngésző nem támogatja a Web Bluetooth-t. Használd Androidon a Chrome-ot.');
  $('add').disabled = true;
}

$('add').onclick = async () => {
  msg();
  if (devices.size >= MAX) { msg('Már van ' + MAX + ' hőmérő.'); return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'LYWSD03MMC' }],
      optionalServices: [SERVICE]
    });
    if (devices.has(dev.id)) { msg('Ez az eszköz már hozzá van adva.'); return; }
    addCard(dev);
  } catch (e) {
    if (e.name !== 'NotFoundError') msg('Hiba: ' + e.message);
  }
};

// korábban engedélyezett eszközök automatikus visszaállítása (ha a Chrome támogatja)
(async () => {
  try {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
    const known = await navigator.bluetooth.getDevices();
    for (const d of known.slice(0, MAX)) if (!devices.has(d.id)) addCard(d);
  } catch (_) {}
})();

// ---- előzmények tárolása
const histKey = dev => 'hist:' + dev.id;
function loadHist(dev) {
  try {
    const a = JSON.parse(localStorage.getItem(histKey(dev)) || '[]');
    const min = Date.now() / 1000 - KEEP;
    return a.filter(p => p[0] >= min);
  } catch (_) { return []; }
}
function saveHist(s) {
  if (!s.dirty) return;
  const store = () => localStorage.setItem(histKey(s.dev), JSON.stringify(s.hist));
  try { store(); s.dirty = false; }
  catch (_) {
    try { s.hist = s.hist.slice(Math.floor(s.hist.length * 0.2)); store(); s.dirty = false; } catch (__) {}
  }
}
function saveAll() { devices.forEach(saveHist); }
setInterval(saveAll, 30000);
addEventListener('pagehide', saveAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });

function addCard(dev) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="top"><span class="name"></span><button class="sec rm">Eltávolít</button></div>
    <div class="vals"><span class="t">–</span><span class="h">–</span></div>
    <div class="meta"><span class="dew">Harmatpont: –</span><span class="bat">Elem: –</span><span class="st">Csatlakozás…</span></div>
    <div class="st clk" style="margin-top:6px">Hőmérő órája: –</div>
    <div class="legend"><span><i style="background:var(--acc)"></i>Hőmérséklet (°C)</span><span><i style="background:var(--hum)"></i>Páratartalom (%)</span></div>
    <canvas></canvas>
    <div class="meta" style="margin-top:8px"><button class="sec dl">Előzmények letöltése a hőmérőből</button><button class="sec sync">Óra szinkron</button></div>
    <div class="st dlst" style="margin-top:6px"></div>`;
  el.querySelector('.name').textContent = dev.name || 'Hőmérő';
  $('list').appendChild(el);
  const s = { dev, el, stop: false, canvas: el.querySelector('canvas'), hist: loadHist(dev), devHist: loadDev(dev), dirty: false, lastT: 0, svc: null, busy: false, clockOff: null };
  if (s.hist.length) s.lastT = s.hist[s.hist.length - 1][0];
  devices.set(dev.id, s);
  el.querySelector('.dl').onclick = () => downloadHistory(s);
  el.querySelector('.sync').onclick = () => syncClock(s);
  el.querySelector('.rm').onclick = () => {
    s.stop = true;
    try { dev.gatt.disconnect(); } catch (_) {}
    try { if (dev.forget) dev.forget(); } catch (_) {}
    try { localStorage.removeItem(histKey(dev)); localStorage.removeItem(devKey(dev)); } catch (_) {}
    el.remove(); devices.delete(dev.id);
  };
  dev.addEventListener('gattserverdisconnected', () => {
    if (s.stop) return;
    setStatus(s, 'Megszakadt, újracsatlakozás…', false);
    setTimeout(() => connect(s), 3000);
  });
  draw(s);
  connect(s);
}

function setStatus(s, text, ok) {
  const st = s.el.querySelector('.st');
  st.textContent = text; st.className = 'st' + (ok ? ' ok' : '');
}

async function connect(s) {
  if (s.stop) return;
  try {
    setStatus(s, 'Csatlakozás…', false);
    const server = await s.dev.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    s.svc = svc;
    const ch = await svc.getCharacteristic(CHAR);
    ch.addEventListener('characteristicvaluechanged', ev => update(s, ev.target.value));
    await ch.startNotifications();
    setStatus(s, 'Csatlakozva', true);
    readClock(s);
  } catch (e) {
    if (s.stop) return;
    setStatus(s, 'Hiba: ' + e.message + ' – újrapróbálom…', false);
    setTimeout(() => connect(s), 5000);
  }
}

// ---- a hőmérő belső (órás) előzményei
const devKey = dev => 'dev:' + dev.id;
function loadDev(dev) {
  try { return JSON.parse(localStorage.getItem(devKey(dev)) || '[]'); } catch (_) { return []; }
}

async function downloadHistory(s) {
  if (s.busy) return;
  const btn = s.el.querySelector('.dl'), st = s.el.querySelector('.dlst');
  const say = t => st.textContent = t;
  if (!s.svc || !s.dev.gatt.connected) { say('Nincs kapcsolat.'); return; }
  s.busy = true; btn.disabled = true;
  let hc = null, onv = null;
  try {
    say('Tartomány lekérdezése…');
    const rv = await (await s.svc.getCharacteristic(U('ccb9'))).readValue();
    if (rv.byteLength < 8) throw new Error('váratlan tartomány-formátum: ' + hex(rv));
    const last = rv.getUint32(0, true), count = rv.getUint32(4, true);
    if (!count) { say('A hőmérőben még nincs előzmény.'); return; }
    const start = Math.max(0, last + 1 - count);

    // a hőmérő órája eltérhet a telefonétól – korrigáljuk
    let offset = 0;
    try {
      const cv = await (await s.svc.getCharacteristic(U('ccb7'))).readValue();
      offset = Math.round(Date.now() / 1000) - cv.getUint32(0, true);
    } catch (_) {}

    const recs = new Map();
    let lastRx = Date.now(), bad = '';
    hc = await s.svc.getCharacteristic(U('ccbc'));
    onv = ev => {
      const v = ev.target.value;
      if (v.byteLength % 14) bad = hex(v);
      for (let o = 0; o + 14 <= v.byteLength; o += 14) {
        recs.set(v.getUint32(o, true), {
          t: v.getUint32(o + 4, true),
          tmax: v.getInt16(o + 8, true) / 10, hmax: v.getUint8(o + 10),
          tmin: v.getInt16(o + 11, true) / 10, hmin: v.getUint8(o + 13)
        });
      }
      lastRx = Date.now();
      say('Letöltés: ' + recs.size + ' / ' + count);
    };
    hc.addEventListener('characteristicvaluechanged', onv);
    const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, start, true);
    await (await s.svc.getCharacteristic(U('ccba'))).writeValueWithResponse(b);
    await hc.startNotifications();
    lastRx = Date.now();
    const t0 = Date.now();
    while (recs.size < count && Date.now() - t0 < 240000 &&
           Date.now() - lastRx < (recs.size ? 3500 : 7000)) {
      await new Promise(r => setTimeout(r, 300));
    }
    if (!recs.size) { say('Nem érkezett adat.' + (bad ? ' Váratlan formátum: ' + bad : '')); return; }

    const now = Date.now() / 1000;
    const pts = [...recs.entries()].sort((a, b) => a[0] - b[0])
      .map(([, r]) => [r.t + offset - 1800, +((r.tmax + r.tmin) / 2).toFixed(2), Math.round((r.hmax + r.hmin) / 2), 1])
      .filter(p => p[0] > 1.5e9 && p[0] < now + 86400);
    if (!pts.length) { say('Az időbélyegek érvénytelenek (a hőmérő órája hibás?).'); return; }
    s.devHist = pts;
    try { localStorage.setItem(devKey(s.dev), JSON.stringify(pts)); } catch (_) {}
    const d0 = new Date(pts[0][0] * 1000).toLocaleDateString('hu-HU');
    say('Kész: ' + pts.length + ' óra (' + d0 + '-tól)' + (recs.size < count ? ', hiányos' : ''));
    draw(s);
  } catch (e) {
    say('Hiba: ' + e.message);
  } finally {
    try { if (hc) { hc.removeEventListener('characteristicvaluechanged', onv); await hc.stopNotifications(); } } catch (_) {}
    s.busy = false; btn.disabled = false;
  }
}

// a hőmérő órájának kiolvasása és élő megjelenítése
async function readClock(s) {
  try {
    if (!s.svc || !s.dev.gatt.connected) return;
    const cv = await (await s.svc.getCharacteristic(U('ccb7'))).readValue();
    if (cv.byteLength < 4) return;
    s.clockOff = cv.getUint32(0, true) - Math.round(Date.now() / 1000);
    renderClock(s);
  } catch (_) {}
}
function renderClock(s) {
  const el = s.el.querySelector('.clk');
  if (s.clockOff === null) return;
  const off = s.clockOff;
  const dt = new Date((Date.now() / 1000 + off) * 1000);
  const a = Math.abs(off);
  const diff = a < 5 ? 'pontos' : (a >= 120 ? Math.round(a / 60) + ' perc' : a + ' mp') + (off > 0 ? ' siet' : ' késik');
  el.textContent = 'Hőmérő órája: ' + dt.toLocaleString('hu-HU') + ' (' + diff + ')';
}
setInterval(() => devices.forEach(renderClock), 1000);
setInterval(() => devices.forEach(s => { if (!s.busy) readClock(s); }), 60000);

// a hőmérő órájának beállítása a telefon idejére
async function syncClock(s) {
  if (s.busy) return;
  const st = s.el.querySelector('.dlst'), say = t => st.textContent = t;
  if (!s.svc || !s.dev.gatt.connected) { say('Nincs kapcsolat.'); return; }
  s.busy = true;
  try {
    const ch = await s.svc.getCharacteristic(U('ccb7'));
    const cur = await ch.readValue();
    if (cur.byteLength < 4) throw new Error('váratlan óra-formátum: ' + hex(cur));
    const before = Math.round(Date.now() / 1000) - cur.getUint32(0, true);
    // a meglévő érték hosszát és a további bájtokat (pl. időzóna) megtartjuk, csak az első 4 bájtot (Unix-idő) írjuk át
    const buf = new Uint8Array(cur.buffer.slice(cur.byteOffset, cur.byteOffset + cur.byteLength));
    new DataView(buf.buffer).setUint32(0, Math.round(Date.now() / 1000), true);
    await ch.writeValueWithResponse(buf);
    const after = await ch.readValue();
    const diff = Math.abs(Math.round(Date.now() / 1000) - after.getUint32(0, true));
    const fmt = d => Math.abs(d) >= 120 ? Math.round(Math.abs(d) / 60) + ' perc' : Math.abs(d) + ' mp';
    say('Óra beállítva (előtte ' + fmt(before) + (before >= 0 ? ' késett' : ' sietett') + ', most ' + fmt(diff) + ' eltérés). A korábbi előzmények a régi időbélyeggel maradnak, ezért érdemes előbb letölteni őket.');
    readClock(s);
  } catch (e) {
    say('Hiba: ' + e.message);
  } finally { s.busy = false; }
}

// a hőmérő óránkénti pontjai csak ott kellenek, ahol nincs saját (percenkénti) mérés
function points(s, from) {
  const own = s.hist, out = [];
  let j = 0;
  for (const p of s.devHist) {
    if (p[0] < from) continue;
    while (j < own.length && own[j][0] < p[0] - 1800) j++;
    if (j < own.length && own[j][0] <= p[0] + 1800) continue;
    out.push(p);
  }
  for (const p of own) if (p[0] >= from) out.push(p);
  return out.sort((a, b) => a[0] - b[0]);
}

// harmatpont (Magnus-képlet)
function dewPoint(t, rh) {
  if (rh <= 0) return null;
  const a = 17.62, b = 243.12;
  const g = Math.log(rh / 100) + a * t / (b + t);
  return b * g / (a - g);
}

function update(s, dv) {
  // 5 bájt: hőmérséklet int16 LE /100, páratartalom uint8, elem mV uint16 LE
  const temp = dv.getInt16(0, true) / 100;
  const hum = dv.getUint8(2);
  const volt = dv.getUint16(3, true) / 1000;
  const pct = Math.max(0, Math.min(100, Math.round((volt - 2.1) / 0.9 * 100)));
  const dp = dewPoint(temp, hum);
  s.el.querySelector('.t').textContent = temp.toFixed(1) + ' °C';
  s.el.querySelector('.h').textContent = hum + ' %';
  s.el.querySelector('.dew').textContent = 'Harmatpont: ' + (dp === null ? '–' : dp.toFixed(1) + ' °C');
  s.el.querySelector('.bat').textContent = 'Elem: ' + volt.toFixed(2) + ' V (~' + pct + '%)';
  setStatus(s, new Date().toLocaleTimeString('hu-HU'), true);

  const now = Math.floor(Date.now() / 1000);
  if (now - s.lastT >= SAMPLE_EVERY) {
    s.hist.push([now, temp, hum]);
    s.lastT = now; s.dirty = true;
    const cut = now - KEEP;
    while (s.hist.length && s.hist[0][0] < cut) s.hist.shift();
    draw(s);
  }
}

// ---- grafikon
function drawAll() { devices.forEach(draw); }
addEventListener('resize', drawAll);

function draw(s) {
  const cv = s.canvas;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cMut = css('--mut'), cLine = css('--line'), cT = css('--acc'), cH = css('--hum');
  ctx.font = '11px system-ui, sans-serif';

  const now = Date.now() / 1000;
  const pts = points(s, now - range);
  if (pts.length < 2) {
    ctx.fillStyle = cMut; ctx.textAlign = 'center';
    ctx.fillText('Még kevés adat a grafikonhoz', w / 2, h / 2);
    return;
  }
  const x0 = pts[0][0], x1 = Math.max(now, pts[pts.length - 1][0]);
  const L = 34, R = 34, T = 8, B = 20;
  const pw = w - L - R, ph = h - T - B;

  const span = arr => {
    let lo = Math.min(...arr), hi = Math.max(...arr);
    if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
    const pad = (hi - lo) * 0.1; return [lo - pad, hi + pad];
  };
  const [tLo, tHi] = span(pts.map(p => p[1]));
  const [hLo, hHi] = span(pts.map(p => p[2]));
  const X = t => L + (t - x0) / (x1 - x0) * pw;
  const YT = v => T + (1 - (v - tLo) / (tHi - tLo)) * ph;
  const YH = v => T + (1 - (v - hLo) / (hHi - hLo)) * ph;

  // vízszintes rács + tengelyfeliratok
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = T + ph * i / 4;
    ctx.strokeStyle = cLine; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
    ctx.fillStyle = cT; ctx.textAlign = 'right';
    ctx.fillText((tHi - (tHi - tLo) * i / 4).toFixed(1), L - 4, y + 4);
    ctx.fillStyle = cH; ctx.textAlign = 'left';
    ctx.fillText(Math.round(hHi - (hHi - hLo) * i / 4), L + pw + 4, y + 4);
  }
  // időfeliratok
  const fmt = t => {
    const d = new Date(t * 1000);
    const hm = d.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
    return (x1 - x0 > 86400) ? d.toLocaleDateString('hu-HU', { month: 'numeric', day: 'numeric' }) + ' ' + hm : hm;
  };
  ctx.fillStyle = cMut;
  ctx.textAlign = 'left'; ctx.fillText(fmt(x0), L, h - 5);
  ctx.textAlign = 'center'; ctx.fillText(fmt((x0 + x1) / 2), L + pw / 2, h - 5);
  ctx.textAlign = 'right'; ctx.fillText(fmt(x1), L + pw, h - 5);

  // vonalak (hosszabb kihagyásnál megszakítva)
  const line = (idx, Y, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    let prev = null, prevDev = false;
    for (const p of pts) {
      const x = X(p[0]), y = Y(p[idx]);
      const gap = (prevDev || p[3]) ? 5400 : SAMPLE_EVERY * 5;
      if (prev === null || p[0] - prev > gap) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      prev = p[0]; prevDev = !!p[3];
    }
    ctx.stroke();
  };
  line(2, YH, cH);
  line(1, YT, cT);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
